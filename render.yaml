databases:
  - name: sales-floor-db
    plan: basic-256mb
    region: oregon
    databaseName: showdown
    user: showdown

services:
  - type: web
    name: sales-floor-showdown
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sales-floor-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
