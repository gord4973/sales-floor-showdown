# Free-tier deploy (no monthly cost). Free Render Postgres expires 30 days after creation.
databases:
  - name: sales-floor-db
    plan: free
    region: oregon
    databaseName: sales_floor_db
    user: sales_floor_db_user

services:
  - type: web
    name: sales-floor-showdown
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sales-floor-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
